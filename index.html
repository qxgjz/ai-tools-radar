<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Tools Radar - 发现最优质的 AI 工具，涵盖写作、图像、视频、编程、音频、效率等分类，提升你的工作效率。">
    <meta name="keywords" content="AI工具,AI导航,ChatGPT,Midjourney,AI写作,AI绘画,AI编程,人工智能工具">
    <meta name="author" content="AI Tools Radar">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph -->
    <meta property="og:title" content="AI Tools Radar - AI工具导航">
    <meta property="og:description" content="发现最优质的 AI 工具，提升你的工作效率">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://qxgjz.github.io/ai-tools-radar/">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AI Tools Radar - AI工具导航">
    <meta name="twitter:description" content="发现最优质的 AI 工具，提升你的工作效率">
    
    <title>AI Tools Radar - AI工具导航</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-top">
                <h1>🛰️ AI Tools Radar</h1>
                <div class="header-actions">
                    <button id="themeToggle" class="icon-btn" title="切换暗色模式">🌙</button>
                    <button id="favToggle" class="icon-btn" title="我的收藏">⭐ <span id="favCount">0</span></button>
                </div>
            </div>
            <p class="subtitle">发现最优质的 AI 工具，提升你的工作效率</p>
            <div class="stats-bar">
                <span>📦 <strong id="totalTools">0</strong> 个工具</span>
                <span>📂 <strong id="totalCategories">0</strong> 个分类</span>
                <span>👁️ <strong id="visitCount">0</strong> 次访问</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索 AI 工具名称、描述或标签...">
                <button onclick="searchTools()">🔍 搜索</button>
            </div>
            <div class="category-filters" id="categoryFilters">
                <!-- 分类按钮通过 JS 动态生成 -->
            </div>
        </div>
    </header>

    <main class="container">
        <div class="view-toggle">
            <button id="gridView" class="view-btn active" title="网格视图">▦</button>
            <button id="listView" class="view-btn" title="列表视图">☰</button>
            <span class="result-count" id="resultCount"></span>
        </div>
        <div class="tools-grid" id="toolsGrid">
            <!-- 工具卡片将通过 JS 动态生成 -->
        </div>
        <div class="no-results" id="noResults" style="display:none;">
            <p>😕 没有找到匹配的工具</p>
            <button onclick="clearFilters()" class="clear-btn">清除筛选</button>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 AI Tools Radar | 让 AI 工具触手可及</p>
            <p class="footer-links">
                <a href="https://github.com/qxgjz/ai-tools-radar" target="_blank" rel="noopener">GitHub 仓库</a>
                · 最后更新: <span id="lastUpdate"></span>
            </p>
        </div>
    </footer>

    <button id="backToTop" class="back-to-top" title="回到顶部">↑</button>

    <script src="script.js"></script>
</body>
</html>
