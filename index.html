    <!-- 结构化数据 JSON-LD -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AI Tools Radar",
        "url": "https://qxgjz.github.io/ai-tools-radar/",
        "description": "发现最优质的 AI 工具，120+ 精选工具，涵盖写作、图像、视频、编程、音频、效率等分类",
        "inLanguage": "zh-CN",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "https://qxgjz.github.io/ai-tools-radar/?q={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-top">
                <h1>🛰️ AI Tools Radar</h1>
                <div class="header-actions">
                    <button id="themeToggle" class="icon-btn" title="切换暗色模式">🌙</button>
                    <button id="favToggle" class="icon-btn" title="我的收藏">⭐ <span id="favCount">0</span></button>
                </div>
            </div>
            <p class="subtitle">发现最优质的 AI 工具，提升你的工作效率</p>
            <div class="stats-bar">
                <span>📦 <strong id="totalTools">0</strong> 个工具</span>
                <span>📂 <strong id="totalCategories">0</strong> 个分类</span>
                <span>👁️ <strong id="visitCount">0</strong> 次访问</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索 AI 工具名称、描述或标签...">
                <button onclick="searchTools()">🔍 搜索</button>
            </div>
            <div class="category-filters" id="categoryFilters">
                <!-- 分类按钮通过 JS 动态生成 -->
            </div>
        </div>
    </header>

    <main class="container">
        <!-- AdSense 顶部横幅广告位 -->
        <div class="ad-container ad-banner">
            <p class="ad-label">广告</p>
            <!-- <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins> -->
            <div class="ad-placeholder">📢 广告位 - 申请 Google AdSense 后在此显示广告</div>
        </div>

        <div class="view-toggle">
            <button id="gridView" class="view-btn active" title="网格视图">▦</button>
            <button id="listView" class="view-btn" title="列表视图">☰</button>
            <span class="result-count" id="resultCount"></span>
        </div>
        <div class="tools-grid" id="toolsGrid">
            <!-- 工具卡片将通过 JS 动态生成 -->
        </div>
        <div class="no-results" id="noResults" style="display:none;">
            <p>😕 没有找到匹配的工具</p>
            <button onclick="clearFilters()" class="clear-btn">清除筛选</button>
        </div>

        <!-- AdSense 中部原生广告位 -->
        <div class="ad-container ad-native">
            <p class="ad-label">广告</p>
            <!-- <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins> -->
            <div class="ad-placeholder">📢 广告位 - 申请 Google AdSense 后在此显示广告</div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 AI Tools Radar | 让 AI 工具触手可及</p>
            <p class="footer-links">
                <a href="https://github.com/qxgjz/ai-tools-radar" target="_blank" rel="noopener">GitHub 仓库</a>
                · 最后更新: <span id="lastUpdate"></span>
            </p>
        </div>
    </footer>

    <button id="backToTop" class="back-to-top" title="回到顶部">↑</button>

    <!-- AdSense 初始化脚本（占位） -->
