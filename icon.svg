<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- 雷达外圈 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.5"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.4"/>

  <!-- 雷达十字线 -->
  <line x1="256" y1="76" x2="256" y2="436" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <line x1="96" y1="256" x2="416" y2="256" stroke="white" stroke-width="1.5" opacity="0.3"/>

  <!-- 雷达扫描扇形 -->
  <path d="M256,256 L256,76 A180,180 0 0,1 410,160 Z" fill="white" opacity="0.15"/>

  <!-- 扫描线 -->
  <line x1="256" y1="256" x2="410" y2="160" stroke="white" stroke-width="3" opacity="0.8" filter="url(#glow)"/>

  <!-- 中心点 -->
  <circle cx="256" cy="256" r="8" fill="white" filter="url(#glow)"/>

  <!-- 目标点 -->
  <circle cx="340" cy="180" r="6" fill="#10b981" filter="url(#glow)"/>
  <circle cx="180" cy="320" r="5" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="320" cy="340" r="4" fill="#ef4444" opacity="0.8"/>

  <!-- AI 文字 -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" opacity="0.9">AI</text>
</svg>
