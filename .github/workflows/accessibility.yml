name: Accessibility Check
on:
  schedule:
    - cron: '0 4 * * 1'  # 每周一凌晨4点运行
  workflow_dispatch:

jobs:
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pa11y
        run: npm install pa11y --save-dev
      
      - name: Wait for Pages deployment
        run: sleep 30
      
      - name: Run pa11y on homepage
        run: |
          npx pa11y \
            --reporter json \
            --threshold 30 \
            --timeout 60000 \
            --wait 2000 \
            --user-agent "Mozilla/5.0 (compatible; Pa11y/1.0)" \
            https://qxgjz.github.io/ai-tools-radar/ \
            > pa11y-home.json 2>&1 || true
      
      - name: Show results
        run: |
          echo "=== 可访问性检测结果（首页）==="
          cat pa11y-home.json | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log('错误数:', data.issues?.filter(i => i.type === 'error').length || 0);
            console.log('警告数:', data.issues?.filter(i => i.type === 'warning').length || 0);
            console.log('提示数:', data.issues?.filter(i => i.type === 'notice').length || 0);
            console.log('');
            console.log('=== 主要问题 ===');
            data.issues?.filter(i => i.type === 'error').slice(0, 10).forEach((issue, i) => {
              console.log(i+1 + '. [' + issue.code + '] ' + issue.message);
              console.log('   选择器: ' + (issue.selector || 'N/A'));
            });
          " || echo "结果解析失败，原始输出：" && cat pa11y-home.json | head -100
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-report
          path: pa11y-home.json
