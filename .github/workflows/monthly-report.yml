name: Monthly Analytics Report
on:
  schedule:
    - cron: '0 9 1 * *'  # 每月1号早上9点
  workflow_dispatch:

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Monthly Report
        run: |
          DATE=$(date +%Y-%m)
          PREV_MONTH=$(date -d "last month" +%Y-%m 2>/dev/null || date -v-1m +%Y-%m 2>/dev/null || echo "上个月")
          
