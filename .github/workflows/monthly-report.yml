          | 页面浏览量 | - | - | - | 25,000 | - |
          | 平均停留时间 | - | - | - | 2分钟 | - |
          | 跳出率 | - | - | - | <60% | - |
          | 新用户比例 | - | - | - | 70% | - |
          
          ### 流量来源
