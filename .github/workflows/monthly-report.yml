          echo "✅ 月度报告已生成：ops/reports/monthly-report-${DATE}.md"
      
      - name: Create Monthly Review Issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const month = new Date().toISOString().slice(0, 7);
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[月度复盘] ${month} 运营数据复盘与下月计划`,
              labels: ['monthly-review', 'analytics', 'high-priority'],
              body: `## 月度复盘会议\n\n本任务由 AI 一人公司自动创建。\n\n**报告**：ops/reports/monthly-report-${month}.md\n**时间**：本月第一周\n**参与人**：CEO（人类）+ AI 团队\n\n## 议程\n\n1. **数据回顾**（30分钟）\n   - 流量指标达成情况\n   - 内容效果分析\n   - SEO 排名变化\n   - 收入数据分析\n\n2. **问题分析**（20分钟）\n   - 未达成目标的原因\n   - 遇到的问题和挑战\n   - 竞争对手动态\n\n3. **下月计划**（30分钟）\n   - 目标设定\n   - 重点项目\n   - 资源分配\n   - 风险应对\n\n## 决策记录\n\n- [ ] 决策1：\n- [ ] 决策2：\n- [ ] 决策3：\n\n## 行动项\n\n- [ ] 行动1：负责人 - 截止时间\n- [ ] 行动2：负责人 - 截止时间\n- [ ] 行动3：负责人 - 截止时间\n\n---\n*自动生成于 ${date}*`
            });
            
            console.log('✅ 已创建月度复盘 Issue');
      
      - name: Commit Report
        run: |
          git config --local user.email "ai-company@users.noreply.github.com"
          git config --local user.name "AI One-Person Company"
          git add "ops/reports/monthly-report-*.md"
          git commit -m "自动生成月度运营报告" || echo "无新报告"
          git push
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-report
          path: ops/reports/monthly-report-*.md
