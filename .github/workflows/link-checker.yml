name: Link Checker
on:
  schedule:
    - cron: '0 3 * * 1'  # 每周一凌晨3点运行
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install broken-link-checker --save-dev
      
      - name: Wait for Pages deployment
        run: sleep 30
      
      - name: Check links
        run: |
          npx blc https://qxgjz.github.io/ai-tools-radar/ \
            --recursive \
            --filter-level 3 \
            --ordered \
            --exclude "twitter.com" \
            --exclude "facebook.com" \
            --exclude "weibo.com" \
            --exclude "github.com/qxgjz" \
            --exclude "fonts.googleapis.com" \
            --exclude "googletagmanager.com" \
            --exclude "google-analytics.com" \
            --exclude "doubleclick.net" \
            --get \
            --timeout 20000 \
            --request-method get \
            --user-agent "Mozilla/5.0 (compatible; LinkChecker/1.0)" \
            > link-report.txt 2>&1 || true
      
      - name: Show report
        run: |
          echo "=== 链接检测报告 ==="
          cat link-report.txt | tail -50
      
      - name: Check for broken links
        run: |
          BROKEN=$(grep -c "BROKEN\|404\|500\|502\|503" link-report.txt || true)
          echo "发现 $BROKEN 个可能的死链"
          if [ "$BROKEN" -gt 5 ]; then
            echo "::warning::发现较多死链，请检查 link-report.txt"
          fi
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link-report.txt
